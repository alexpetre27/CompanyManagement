spring.application.name=company-management

# --- Database (all values come from the environment; see .env.example) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:postgres}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Security ---
# JWT signing key: must be at least 32 bytes. Generate with: openssl rand -base64 48
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Shared secret that only the Next.js server knows; required for /api/auth/social
app.internal-api-secret=${INTERNAL_API_SECRET:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Seed data (only applied when the users table is empty) ---
app.seed.admin-username=${ADMIN_USERNAME:admin}
app.seed.admin-email=${ADMIN_EMAIL:admin@company.local}
app.seed.admin-password=${ADMIN_PASSWORD:}
app.seed.demo-data=${SEED_DEMO_DATA:true}

# --- Uploads ---
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# --- Actuator: only health, component status without connection details ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always

# --- API docs ---
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
